# Copie para config.toml e preencha. config.toml está no .gitignore — ele guarda segredos.

[mqtt]
# Hostname do cluster HiveMQ, sem esquema. Ex.: "abc123....s1.eu.hivemq.cloud"
host = "SEU-CLUSTER.s1.eu.hivemq.cloud"
port = 8883
# Credencial COM PERMISSÃO DE ASSINAR apenas. O Lambda usa outra, só de publicar.
username = "alexawol-agent"
password = "TROQUE-ME"
client_id = "alexawol-agent"
cmd_topic = "alexawol/cmd"
state_topic = "alexawol/state"

[publisher]
# Opcional, usado SÓ por tools/send_cmd.py, que faz o papel do Lambda nos testes.
# Preencha com a credencial do Lambda (alexawol-lambda), que já tem permissão de publicar
# em alexawol/cmd. Assim você testa sem afrouxar a ACL do agente — que, corretamente, só
# pode assinar comandos, nunca emiti-los.
# O agente ignora esta seção.
username = ""
password = ""

[security]
# Segredo compartilhado com o Lambda. Precisa ser idêntico dos dois lados.
# Gere com:  python -c "import secrets; print(secrets.token_hex(32))"
secret = "TROQUE-ME"

[media]
# O que a cena "Música do computador" abre. Fica só aqui, de propósito: o comando que chega
# pela rede diz apenas "toque", nunca o que tocar.
# Aceita qualquer coisa que o Windows saiba abrir:
#   Faixa Spotify → "spotify:track:4cOdK2wGLETKBW3PvgPWqT"
#   Playlist      → "spotify:playlist:37i9dQZF1DXcBWIGoYBM5M"
#   YouTube       → "https://www.youtube.com/watch?v=..."
#   Arquivo       → "C:\\Users\\<voce>\\Music\\musica.mp3"
target = ""

[power]
# Segundos entre receber o comando e o desligamento efetivo. É a janela para dizer
# "Alexa, cancelar" caso tenha sido engano.
shutdown_delay = 20
# true adiciona /f ao shutdown: fecha aplicativos à força. Mais confiável, porém pode
# descartar trabalho não salvo.
force = false
